[workspace]
resolver = "3"
members = ["app", "core/*", "libs/*", "modules/*", "xtask"]
default-members = ["app", "core/*", "libs/*", "modules/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
uniwow-api = { path = "core/api" }
uniwow-kernel = { path = "core/kernel" }
uniwow-lua = { path = "libs/lua" }
eframe = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }
glam = "0.30"
bytemuck = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
libloading = "0.9"
blake3 = "1"
cc = "1"

# Optimised even in debug: without it the runtime DLL exceeds the Windows limit of 65,535 exported symbols.
[profile.dev]
opt-level = 2
# Line numbers only: full debug information makes the runtime's PDB weigh over 200 MB.
debug = "line-tables-only"
