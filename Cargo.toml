[workspace]
resolver = "3"
# Module ids are lowercase: `modules/[!U]*` takes every module but the group folder `modules/UI`,
# whose modules `modules/UI/*` takes.
members = ["app", "core/*", "libs/*", "modules/[!U]*", "modules/UI/*", "xtask"]
default-members = ["app", "core/*", "libs/*", "modules/[!U]*", "modules/UI/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
uniwow-api = { path = "core/api" }
uniwow-kernel = { path = "core/kernel" }
uniwow-lua = { path = "libs/lua" }
uniwow-server-link = { path = "libs/server-link" }
eframe = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }
glam = "0.30"
bytemuck = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
libloading = "0.9"
blake3 = "1"
cc = "1"
miniz_oxide = "0.8"
rfd = { version = "0.17", default-features = false }
windows = "0.62"

# Optimised even in debug: without it the runtime DLL exceeds the Windows limit of 65,535 exported symbols.
[profile.dev]
opt-level = 2
# Line numbers only: full debug information makes the runtime's PDB weigh over 200 MB.
debug = "line-tables-only"
